<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb Login</title>
</head>
<body>
    <header class="header">
        <h1 class="header__titulo">Login</h1>
    </header>
    <nav class="nav">
        <a href="index.html" class="nav__link">Voltar</a>
    </nav>
    <main>
<form class="login__formulario">
    <fieldset>
        <legend> Informações para login </legend>            
            <p class="login__formulario-texto">
                <label for="email">E-mail:</label>
                
                <input
                type="email"
                id="email"
                name="email"
                required
                >
        </p>
        
        <p class="login__formulario-texto">
            <label for="senha">Crie uma senha:</label>
            
            <input
            type="password"
            id="senha"
                name="senha"
                required
                >
            </p>            
        <button type="submit" class="login__botao">
            Realizar Login
        </button>
        
    </fieldset>
</form>

    </main>
    <form action=""></form>
</body>
</html>
